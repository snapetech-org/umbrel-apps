# ng-runner-policy: private-jit-only-v1
name: Public fork app lint
run-name: action:scan:pool:private:public-fork

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: public-fork-app-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lint-fork:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/umbrel-apps' &&
      github.event.pull_request.base.ref == 'master'
    uses: snapetech-org/umbrel-apps/.github/workflows/fork-safe-lint-apps.yml@86e622658bf6209ba9a5419c98bd0a07dbc3f29e
