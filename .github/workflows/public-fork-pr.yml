# ng-runner-policy: private-jit-only-v1
name: Public fork app lint
run-name: action:ci:pool:public:fork

on:
  pull_request:
    branches: [master]
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-fork-app-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lint-fork:
    if: >-
      github.event.action == 'labeled' &&
      github.actor == 'snapetech' &&
      (startsWith(github.event.label.name, 'action:') ||
       startsWith(github.event.label.name, 'pool:')) &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      (contains(github.event.pull_request.labels.*.name, 'pool:public') ||
       contains(github.event.pull_request.labels.*.name, 'pool:hybrid')) &&
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/umbrel-apps' &&
      github.event.pull_request.base.ref == 'master'
    permissions:
      contents: read
      pull-requests: read
    uses: snapetech-org/umbrel-apps/.github/workflows/fork-safe-lint-apps.yml@db14f00fadaefa03680c60faa34a5675e374197b
